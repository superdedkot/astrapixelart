[plugin]
min_astra_version = "0.2.6"
id = "astrapixelart"
name = "APA — Pixel Art for Astra"
version = "0.3.3"
description = "Create without limits: paint pixels, bring emotions to life, and even redraw Astra! Layers, animation frames, and sticker exports in one place."
author = "Доктор Кот (superdedkot)"
license = "MIT"

[entry]
command = "python"
args = ["-m", "src.plugin"]
runtimes = ["python"]

[capabilities]
ui_contributions = true
